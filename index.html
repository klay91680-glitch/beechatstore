<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BeeChat Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #fff; color: #202124; padding-bottom: 80px; }

        /* Top Header */
        .top-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; position: sticky; top: 0; background: #fff; z-index: 10; }
        .logo-area { font-size: 22px; font-weight: 500; color: #3c4043; display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }

        /* Profile Icon */
        .profile-btn { width: 36px; height: 36px; background: transparent; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #5f6368; transition: 0.2s; }
        .profile-btn:hover { background: #f1f3f4; }
        .profile-btn .material-symbols-outlined { font-size: 32px; }

        /* Search Bar */
        .search-container { display: none; padding: 10px 20px; background: #fff; position: sticky; top: 66px; z-index: 9; border-bottom: 1px solid #eee; }
        .search-container.active { display: block; }
        .search-input { width: 100%; padding: 12px 15px; border-radius: 25px; border: 1px solid #dadce0; background: #f1f3f4; font-size: 15px; outline: none; }
        .search-input:focus { border-color: #1a73e8; background: #fff; }

        /* Categories */
        .categories { display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; background: #f1f3f4; border-radius: 20px; font-size: 14px; font-weight: 500; color: #3c4043; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .cat-btn.active { background: #e8f0fe; color: #1a73e8; border: 1px solid #1a73e8; }

        /* Featured Banner */
        .featured-banner { padding: 15px 20px; }
        .banner-card { background: linear-gradient(135deg, #8e24aa, #3949ab); border-radius: 16px; padding: 20px; color: white; height: 180px; display: flex; flex-direction: column; justify-content: flex-end; }
        .banner-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 5px; }

        /* App List */
        .section-title { font-size: 16px; font-weight: 500; padding: 15px 20px 10px; color: #202124; }
        .app-item { display: flex; align-items: center; padding: 12px 20px; gap: 16px; }
        
        .app-icon { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .icon-white { background: #ffffff; border: 2px solid #ccc; color: #000; }
        .icon-red { background: #e53935; color: #fff; }
        .icon-yellow-cup { background: #fdd835; color: #000; }
        .icon-yellow-dragon { background: #ffb300; color: #000; }
        .icon-telegram { background: #229ED9; color: #fff; font-size: 32px; }

        .app-info { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .app-title { font-size: 15px; font-weight: 500; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-dev { font-size: 13px; color: #5f6368; }
        .app-meta { font-size: 12px; color: #5f6368; display: flex; align-items: center; gap: 6px; }
        .app-meta .star { color: #1a73e8; display: flex; align-items: center; font-weight: 500; }

        /* ခလုတ် ဒီဇိုင်း */
        .action-btn { background: #1a73e8; color: white; border: none; padding: 8px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 85px; text-align: center; transition: 0.3s; }
        .action-btn:active { background: #1557b0; }
        .action-btn.installed { background: #e8f0fe; color: #1a73e8; font-weight: 600; border: 1px solid #1a73e8; }

        .no-result { display: none; text-align: center; padding: 40px 20px; color: #5f6368; font-size: 15px; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 8px 0 12px 0; border-top: 1px solid #dadce0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #5f6368; font-size: 12px; gap: 4px; width: 25%; cursor: pointer; }
        .nav-item.active { color: #1a73e8; }
        .nav-item.active .nav-icon-bg { background: #e8f0fe; border-radius: 20px; padding: 2px 18px; }
        .material-symbols-outlined { font-size: 24px; }

        /* Profile Page */
        .profile-page { display: none; padding: 40px 20px; text-align: center; }
        .profile-page.active { display: block; }
        .profile-img-empty { width: 100px; height: 100px; background: #f1f3f4; color: #9aa0a6; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .profile-img-empty .material-symbols-outlined { font-size: 60px; }
        
        #main-content { display: block; }
        #main-content.hidden { display: none; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="logo-area">
            <!-- မင်း GitHub က ပုံရဲ့ Link အမှန်ကို ဒီမှာ ထည့်ပေးထားပါတယ် -->
            <img src="https://raw.githubusercontent.com/klay91680-glitch/beechatstoreicon/main/file_00000000ebec82118ac8e6b60eca2810.png" class="app-logo" alt="BeeChat Store Logo" onerror="this.style.display='none'">
            BeeChat Store
        </div>
        <div class="profile-btn" onclick="switchTab('you', document.getElementById('nav-you'))">
            <span class="material-symbols-outlined">account_circle</span>
        </div>
    </div>

    <div class="search-container" id="searchContainer">
        <input type="text" id="searchInput" class="search-input" placeholder="App တွေကို ရှာဖွေပါ..." onkeyup="filterApps()">
    </div>

    <div id="main-content">
        <div class="categories">
            <div class="cat-btn active"><span class="material-symbols-outlined" style="font-size: 18px;">bar_chart</span> Top charts</div>
        </div>

        <div class="featured-banner">
            <div class="banner-card">
                <h2>Welcome to BeeChat Store</h2>
                <p style="font-size: 12px; opacity: 0.8;">Smart Download System</p>
            </div>
        </div>

        <div class="section-title" id="sectionTitle">Suggested for you</div>

        <div id="appList">
            <!-- Apps တွေ ဒီနေရာမှာ ပေါ်လာမယ် -->
        </div>

        <div class="no-result" id="noResult">ရှာဖွေမှုနှင့် ကိုက်ညီသော App မတွေ့ပါ။</div>
    </div>

    <!-- Profile Page -->
    <div class="profile-page" id="profilePage">
        <div class="profile-img-empty">
            <span class="material-symbols-outlined">person</span>
        </div>
        <div class="profile-name" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">အကောင့်မရှိပါ</div>
        <p style="color: #5f6368; font-size: 14px; margin-bottom: 20px;">အကောင့်ဝင်ရန် သို့မဟုတ် အကောင့်အသစ်ဖွင့်ရန် နှိပ်ပါ။</p>
        <button onclick="alert('အကောင့်ဝင်ရန် စနစ် မထည့်ရသေးပါဘူးဗျ')" style="padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;">အကောင့်ဝင်ရန် / အကောင့်ဖွင့်ရန်</button>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item">
            <span class="material-symbols-outlined">sports_esports</span> Games
        </div>
        <div class="nav-item active" id="nav-apps" onclick="resetView()">
            <div class="nav-icon-bg"><span class="material-symbols-outlined">apps</span></div> Apps
        </div>
        <div class="nav-item" id="nav-search" onclick="toggleSearch(this)">
            <span class="material-symbols-outlined">search</span> Search
        </div>
        <div class="nav-item" id="nav-you" onclick="switchTab('you', this)">
            <span class="material-symbols-outlined">person</span> You
        </div>
    </div>

    <script>
        const appData = [
            { 
                id: "telegram", 
                name: "Telegram", 
                dev: "Telegram FZ-LLC • Android 6.0+", 
                iconText: "✈️", 
                iconClass: "icon-telegram", 
                rating: "4.5", 
                size: "11.0.1 (51762)", 
                link: "https://dl.androidapksfree.net/file/8614f165983fa549?e=1793059200&s=3605c035a3dffa2ae3bb93e877380b6ca5febc7d95d18dc69a323c759bc1ab5a" 
            },
            { 
                id: "app1", 
                name: "အဖြူရောင် APK", 
                dev: "White App", 
                iconText: "W", 
                iconClass: "icon-white", 
                rating: "4.8", 
                size: "15 MB", 
                link: "https://sss666ss.com" 
            },
            { 
                id: "app2", 
                name: "အနီဂျိုကာ APK", 
                dev: "Red App", 
                iconText: "R", 
                iconClass: "icon-red", 
                rating: "4.5", 
                size: "25 MB", 
                link: "http://399slots.com" 
            },
            { 
                id: "app3", 
                name: "အဝါရောင်ဇီးခွက် APK", 
                dev: "Yellow Cup App", 
                iconText: "C", 
                iconClass: "icon-yellow-cup", 
                rating: "4.7", 
                size: "30 MB", 
                link: "https://777r.co" 
            },
            { 
                id: "app4", 
                name: "အဝါရောင်နဂါး APK", 
                dev: "Yellow Dragon App", 
                iconText: "D", 
                iconClass: "icon-yellow-dragon", 
                rating: "4.6", 
                size: "40 MB", 
                link: "https://777x.co" 
            }
        ];

        const appListContainer = document.getElementById('appList');

        function renderApps() {
            appListContainer.innerHTML = '';

            appData.forEach(app => {
                const isInstalled = localStorage.getItem('downloaded_' + app.id) === 'true';
                const btnText = isInstalled ? 'Open' : 'Install';
                const btnClass = isInstalled ? 'action-btn installed' : 'action-btn';

                const appItem = document.createElement('div');
                appItem.className = 'app-item';
                appItem.setAttribute('data-name', app.name + ' ' + app.dev);

                appItem.innerHTML = `
                    <div class="app-icon ${app.iconClass}">${app.iconText}</div>
                    <div class="app-info">
                        <div class="app-title">${app.name}</div>
                        <div class="app-dev">${app.dev}</div>
                        <div class="app-meta">
                            <span class="star"><span class="material-symbols-outlined" style="font-size: 14px; font-variation-settings: 'FILL' 1;">star</span> ${app.rating}</span> • ${app.size}
                        </div>
                    </div>
                    <button class="${btnClass}" id="btn-${app.id}" data-link="${app.link}" onclick="smartInstall('${app.id}', this, '${app.link}')">${btnText}</button>
                `;
                appListContainer.appendChild(appItem);
            });
        }

        window.onload = function() {
            renderApps();
        };

        function smartInstall(appId, btn, link) {
            if (localStorage.getItem('downloaded_' + appId) === 'true') {
                window.open(link, '_blank');
                return;
            }

            btn.innerText = 'Downloading...';
            btn.style.background = '#e8f0fe';
            btn.style.color = '#1a73e8';
            window.open(link, '_blank');
            localStorage.setItem('downloaded_' + appId, 'true');

            setTimeout(() => {
                btn.innerText = 'Open';
                btn.classList.add('installed');
                btn.style.background = '';
                btn.style.color = '';
            }, 2000);
        }

        function toggleSearch(element) {
            const searchContainer = document.getElementById('searchContainer');
            const searchInput = document.getElementById('searchInput');
            const sectionTitle = document.getElementById('sectionTitle');
            const mainContent = document.getElementById('main-content');
            const profilePage = document.getElementById('profilePage');
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            if (searchContainer.classList.contains('active')) {
                searchContainer.classList.remove('active');
                resetView(); 
            } else {
                mainContent.classList.remove('hidden');
                profilePage.classList.remove('active');
                
                searchContainer.classList.add('active');
                searchInput.focus();
                sectionTitle.innerText = "Search Results";
                searchInput.value = ''; 
                filterApps(); 
            }
        }

        function filterApps() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const appItems = document.querySelectorAll('.app-item');
            const noResult = document.getElementById('noResult');
            let hasResult = false;

            appItems.forEach(item => {
                const appName = item.getAttribute('data-name').toLowerCase();
                if (appName.includes(input)) {
                    item.style.display = 'flex';
                    hasResult = true;
                } else {
                    item.style.display = 'none';
                }
            });

            if (hasResult || input === '') {
                noResult.style.display = 'none';
            } else {
                noResult.style.display = 'block';
            }
        }

        function resetView() {
            document.getElementById('searchContainer').classList.remove('active');
            document.getElementById('sectionTitle').innerText = "Suggested for you";
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.app-item').forEach(item => {
                item.style.display = 'flex';
            });
            document.getElementById('noResult').style.display = 'none';
            
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('profilePage').classList.remove('active');

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-apps').classList.add('active');
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            const mainContent = document.getElementById('main-content');
            const profilePage = document.getElementById('profilePage');
            const searchContainer = document.getElementById('searchContainer');

            if (tabName === 'you') {
                mainContent.classList.add('hidden');
                searchContainer.classList.remove('active');
                profilePage.classList.add('active');
            }
        }
    </script>
</body>
            </html>
